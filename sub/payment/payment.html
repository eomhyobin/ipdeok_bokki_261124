
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>입덕볶이 - 주문 및 결제</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/payment.css">
</head>

<body>

    <div class="container">

        <!-- 헤더 -->
        <header class="header">

            <a href="../lists/lists.html?cart=1" class="back-button" aria-label="뒤로가기">
                <svg width="28" height="28" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </a>

            <a href="../../index.html" class="logo">
                <img src="../lists/img/logo.png" alt="입덕볶이">
            </a>

            <button class="menu-button" id="menuOpen" aria-label="메뉴 열기">
                <svg width="28" height="28" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M4 6h16"/>
                    <path d="M4 12h16"/>
                    <path d="M4 18h16"/>
                </svg>
            </button>

        </header>


        <!-- 햄버거 슬라이드 메뉴 -->
        <div class="menu-layer" id="menuLayer">

            <div class="menu-overlay" id="menuOverlay"></div>

            <nav class="side-menu">

                <div class="side-menu-header">

                    <button id="menuClose" aria-label="메뉴 닫기">
                        <svg width="28" height="28" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">
                            <path d="M18 6 6 18"/>
                            <path d="m6 6 12 12"/>
                        </svg>
                    </button>

                </div>

                <ul class="side-menu-list">

    <li>
        <a href="../../index.html">메인페이지</a>
    </li>

    <li>
        <a href="../lists/lists.html">리스트페이지</a>
    </li>

    <li>
        <a href="../detail/detail.html">상세페이지</a>
    </li>


    <li>
        <a href="../payment_finish/payment_finish.html">결제 완료</a>
    </li>

</ul>

            </nav>

        </div>


        <!-- 페이지 제목 -->
        <section class="page-title">

            <h1>주문 및 결제</h1>

            <p>입덕하기까지 얼마 남지 않았어요!</p>

        </section>


        <!-- 배달 정보 -->
        <section class="payment-section">

            <div class="section-title">

                <h2>배달 정보</h2>

                <a href="../../index.html" class="change-address">
                    주소 변경
                </a>

            </div>

            <div class="delivery-card">

                <div class="delivery-title">

                    <svg width="22" height="22" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>

                    <strong id="addressName">우리 집</strong>

                    <span id="addressStatus">예시 주소</span>

                </div>

                <p class="address" id="deliveryAddress"></p>

                <p class="address-detail" id="deliveryDetail"></p>

                <p class="phone" id="deliveryPhone"></p>

            </div>


            <!-- 배달 요청사항 -->
            <div class="request-box">

                <label for="deliveryRequest">배달 요청사항</label>

                <select id="deliveryRequest">

                    <option value="">요청사항을 선택해 주세요.</option>

                    <option value="문 앞에 놓아주세요.">
                        문 앞에 놓아주세요.
                    </option>

                    <option value="도착하면 전화해 주세요.">
                        도착하면 전화해 주세요.
                    </option>

                    <option value="벨을 누르지 말아주세요.">
                        벨을 누르지 말아주세요.
                    </option>

                    <option value="직접 받을게요.">
                        직접 받을게요.
                    </option>

                    <option value="custom">
                        직접 입력
                    </option>

                </select>

                <textarea id="customRequest"
                    placeholder="배달 요청사항을 입력해 주세요."
                    maxlength="100"
                    hidden></textarea>

            </div>

        </section>


        <!-- 주문 메뉴 -->
        <section class="payment-section">

            <div class="section-title">

                <h2>주문 메뉴</h2>

                <span class="menu-count" id="orderCount">총 0개</span>

            </div>

            <div class="order-list" id="orderList">

                <!-- 주문 메뉴 자동 생성 -->

            </div>

            <a href="../lists/lists.html" class="more-menu">

                <span>+</span> 메뉴 더 담기

            </a>

        </section>


        <!-- 할인 쿠폰 -->
        <section class="payment-section">

            <div class="section-title">

                <h2>할인 쿠폰</h2>

            </div>

            <div class="coupon-box">

                <svg width="22" height="22" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9a3 3 0 0 0 0 6v4h16v-4a3 3 0 0 1 0-6V5H4Z"/>
                    <path d="M13 5v2m0 3v2m0 3v4"/>
                </svg>

                <select id="couponSelect" aria-label="할인 쿠폰">

                    <option value="0">쿠폰을 선택해 주세요.</option>

                    <option value="2000">첫 입덕 기념 2,000원 할인</option>

                </select>

            </div>

        </section>


        <!-- 결제 수단 -->
        <section class="payment-section">

            <div class="section-title">

                <h2>결제 수단</h2>

            </div>

            <div class="payment-methods">

                <!-- 신용 / 체크카드 -->
                <label class="method-item">

                    <svg width="25" height="25" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"/>
                        <path d="M2 10h20"/>
                    </svg>

                    <span>신용 / 체크카드</span>

                    <input type="radio" name="paymentMethod"
                        value="신용 / 체크카드" checked>

                </label>


                <!-- 카카오페이 -->
                <label class="method-item">

                    <span class="pay-icon kakao">pay</span>

                    <span>카카오페이</span>

                    <input type="radio" name="paymentMethod"
                        value="카카오페이">

                </label>


                <!-- 네이버페이 -->
                <label class="method-item">

                    <span class="pay-icon naver">N</span>

                    <span>네이버페이</span>

                    <input type="radio" name="paymentMethod"
                        value="네이버페이">

                </label>


                <!-- 토스페이 -->
                <label class="method-item">

                    <span class="pay-icon toss">toss</span>

                    <span>토스페이</span>

                    <input type="radio" name="paymentMethod"
                        value="토스페이">

                </label>

            </div>

        </section>


        <!-- 결제 금액 -->
        <section class="payment-section price-section">

            <div class="section-title">

                <h2>결제 금액</h2>

            </div>

            <div class="price-row">

                <span>총 주문금액</span>

                <strong id="productTotal">0원</strong>

            </div>

            <div class="price-row">

                <span>배달비</span>

                <strong id="deliveryFee">0원</strong>

            </div>

            <div class="price-row discount-row">

                <span>쿠폰 할인</span>

                <strong id="discountPrice">0원</strong>

            </div>

            <div class="final-price">

                <span>최종 결제금액</span>

                <strong id="finalPrice">0원</strong>

            </div>

            <label class="agreement">

                <input type="checkbox" id="agreementCheck">

                <span>주문 내용을 확인했으며 결제에 동의합니다.</span>

            </label>

            <p class="test-notice">
                시제품 테스트용으로 실제 결제는 진행되지 않습니다.
            </p>

        </section>


        <!-- 하단 고정 결제 버튼 -->
        <footer class="payment-footer">

            <button id="payButton" disabled>

                0원 결제하기

            </button>

        </footer>

    </div>


    <!-- JavaScript -->
    <script>

        // ==========================
        // 1. 주문 데이터 불러오기
        // ==========================

        const params = new URLSearchParams(location.search);

        const isDirectOrder = params.get('mode') === 'direct';

        const cart = JSON.parse(
            localStorage.getItem('ipdeokOrderCart') || '[]'
        );

        const directOrder = JSON.parse(
            sessionStorage.getItem('ipdeokDirectOrder') || 'null'
        );

        // 바로 주문과 장바구니 주문 구분
        const orderMenus = isDirectOrder
            ? (directOrder ? [directOrder] : [])
            : cart;


        // 금액 표시 함수
        function won(price) {

            return price.toLocaleString('ko-KR') + '원';

        }


        // 바로 주문일 경우 상세페이지로 돌아가기
        if (isDirectOrder && directOrder && directOrder.detailUrl) {

            document.querySelector('.back-button').href =
                directOrder.detailUrl;

        }


        // ==========================
        // 2. 배달 정보 불러오기
        // ==========================

        const savedAddress = JSON.parse(
            localStorage.getItem('ipdeokDelivery') || 'null'
        );

        // 메인페이지 주소 설정 기능 제작 전 임시 정보
        const deliveryInfo = savedAddress || {

            name: '우리 집',
            address: '인천시 ○○구 ○○로 123',
            detail: '101동 502호',
            phone: '010-0000-0000'

        };

        document.getElementById('addressName').textContent =
            deliveryInfo.name || '배달 주소';

        document.getElementById('deliveryAddress').textContent =
            deliveryInfo.address;

        document.getElementById('deliveryDetail').textContent =
            deliveryInfo.detail;

        document.getElementById('deliveryPhone').textContent =
            deliveryInfo.phone;

        document.getElementById('addressStatus').textContent =
            savedAddress ? '저장된 주소' : '예시 주소';


        // ==========================
        // 3. 배달 요청사항
        // ==========================

        const deliveryRequest =
            document.getElementById('deliveryRequest');

        const customRequest =
            document.getElementById('customRequest');

        deliveryRequest.addEventListener('change', function () {

            customRequest.hidden =
                deliveryRequest.value !== 'custom';

            if (deliveryRequest.value === 'custom') {

                customRequest.focus();

            }

        });


        // ==========================
        // 4. 주문 메뉴 표시
        // ==========================

        const orderList = document.getElementById('orderList');

        const orderCount = document.getElementById('orderCount');

        let productTotal = 0;

        let totalQuantity = 0;


        function showOrderMenus() {

            orderList.innerHTML = '';

            productTotal = 0;

            totalQuantity = 0;


            // 주문 메뉴가 없는 경우
            if (orderMenus.length === 0) {

                orderList.innerHTML = `
                    <div class="empty-order">
                        주문할 메뉴가 없습니다.
                    </div>
                `;

            }


            orderMenus.forEach(function (menu) {

                productTotal += menu.total;

                totalQuantity += menu.qty;


                const item = document.createElement('article');

                item.className = 'order-item';


                const options = [

                    menu.spicy,
                    ...(menu.toppings || [])

                ].filter(Boolean).join(' / ');


                item.innerHTML = `

                    <div class="order-image"
                        style="background-image: url('../lists/${menu.image}')">
                    </div>

                    <div class="order-info">

                        <h3>${menu.name}</h3>

                        <p class="order-options">
                            ${options || '추가 옵션 없음'}
                        </p>

                        <p class="order-quantity">
                            수량 ${menu.qty}개
                        </p>

                        <strong class="order-price">
                            ${won(menu.total)}
                        </strong>

                    </div>

                `;

                orderList.appendChild(item);

            });


            orderCount.textContent = '총 ' + totalQuantity + '개';

        }


        // ==========================
        // 5. 결제 금액 계산
        // ==========================

        const couponSelect = document.getElementById('couponSelect');

        const agreementCheck =
            document.getElementById('agreementCheck');

        const payButton = document.getElementById('payButton');

        let finalTotal = 0;

        let discount = 0;

        let deliveryFee = 0;


        function updatePrice() {

            // 주문 메뉴가 있을 때만 배달비 적용
            deliveryFee = orderMenus.length > 0 ? 3000 : 0;

            // 할인금액이 주문금액을 초과하지 않도록 설정
            discount = Math.min(
                Number(couponSelect.value),
                productTotal
            );

            finalTotal = productTotal + deliveryFee - discount;


            document.getElementById('productTotal').textContent =
                won(productTotal);

            document.getElementById('deliveryFee').textContent =
                won(deliveryFee);

            document.getElementById('discountPrice').textContent =
                discount > 0 ? '-' + won(discount) : '0원';

            document.getElementById('finalPrice').textContent =
                won(finalTotal);


            payButton.textContent =
                won(finalTotal) + ' 결제하기';


            // 주문 메뉴가 있고 결제에 동의해야 버튼 활성화
            payButton.disabled =
                !agreementCheck.checked || orderMenus.length === 0;

        }


        couponSelect.addEventListener('change', updatePrice);

        agreementCheck.addEventListener('change', updatePrice);


        // ==========================
        // 6. 결제하기
        // ==========================

        payButton.addEventListener('click', function () {

            if (!agreementCheck.checked || orderMenus.length === 0) {

                return;

            }


            // 선택한 결제 수단
            const paymentMethod = document.querySelector(
                'input[name="paymentMethod"]:checked'
            ).value;


            // 배달 요청사항
            const request = deliveryRequest.value === 'custom'
                ? customRequest.value.trim()
                : deliveryRequest.value;


            if (deliveryRequest.value === 'custom' && !request) {

                alert('배달 요청사항을 입력해 주세요.');

                customRequest.focus();

                return;

            }


            // 결제 완료 페이지에 전달할 주문 정보
            const completedOrder = {

                orderNumber: 'IP' + Date.now(),

                orderDate: new Date().toISOString(),

                menus: orderMenus,

                delivery: deliveryInfo,

                request: request || '요청사항 없음',

                paymentMethod: paymentMethod,

                productTotal: productTotal,

                deliveryFee: deliveryFee,

                discount: discount,

                finalTotal: finalTotal,

                totalQuantity: totalQuantity,

                testPayment: true

            };


            // 중복 클릭 방지
            payButton.disabled = true;

            payButton.textContent = '결제 진행 중...';


            // 주문 완료 정보 저장
            localStorage.setItem(
                'ipdeokLastOrder',
                JSON.stringify(completedOrder)
            );


            // 바로 주문이면 기존 장바구니 유지
            if (isDirectOrder) {

                sessionStorage.removeItem('ipdeokDirectOrder');

            } else {

                // 장바구니 주문이면 결제 후 비우기
                localStorage.removeItem('ipdeokOrderCart');

            }


            // 결제 완료 페이지 이동
            setTimeout(function () {

                window.location.href =
                    '../payment_finish/payment_finish.html';

            }, 600);

        });


        // ==========================
        // 7. 햄버거 메뉴
        // ==========================

        const menuOpen = document.getElementById('menuOpen');

        const menuClose = document.getElementById('menuClose');

        const menuLayer = document.getElementById('menuLayer');

        const menuOverlay = document.getElementById('menuOverlay');


        menuOpen.addEventListener('click', function () {

            menuLayer.classList.add('active');

            document.body.style.overflow = 'hidden';

        });


        function closeMenu() {

            menuLayer.classList.remove('active');

            document.body.style.overflow = '';

        }


        menuClose.addEventListener('click', closeMenu);

        menuOverlay.addEventListener('click', closeMenu);


        document.addEventListener('keydown', function (event) {

            if (event.key === 'Escape') {

                closeMenu();

            }

        });


        // ==========================
        // 8. 처음 접속했을 때 실행
        // ==========================

        showOrderMenus();

        updatePrice();

    </script>

</body>
</html>
