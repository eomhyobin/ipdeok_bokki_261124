
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>입덕볶이 - 메뉴 상세</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/detail.css">
</head>

<body>

    <div class="container">

        <!-- 헤더 -->
        <header class="header">

            <a href="../lists/lists.html" class="back-button" aria-label="뒤로가기">
                <svg width="28" height="28" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </a>

            <a href="../../index.html" class="logo">
                <img src="../lists/img/logo.png" alt="입덕볶이">
            </a>

            <button class="menu-button" id="menuOpen" aria-label="메뉴 열기">
                <svg width="28" height="28" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M4 6h16"/>
                    <path d="M4 12h16"/>
                    <path d="M4 18h16"/>
                </svg>
            </button>

        </header>


        <!-- 햄버거 슬라이드 메뉴 -->
        <div class="menu-layer" id="menuLayer">

            <div class="menu-overlay" id="menuOverlay"></div>

            <nav class="side-menu">

                <div class="side-menu-header">
                    <button id="menuClose" aria-label="메뉴 닫기">
                        <svg width="28" height="28" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">
                            <path d="M18 6 6 18"/>
                            <path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>

                <ul class="side-menu-list">

    <li>
        <a href="../../index.html">메인페이지</a>
    </li>

    <li>
        <a href="../lists/lists.html">리스트페이지</a>
    </li>

    <li>
        <a href="../payment/payment.html">결제페이지</a>
    </li>

    <li>
        <a href="../payment_finish/payment_finish.html">결제 완료</a>
    </li>

</ul>

            </nav>

        </div>


        <!-- 메뉴 대표 이미지 -->
        <section class="product-image">

            <img id="productImage" src="" alt="메뉴 이미지">

        </section>


        <!-- 메뉴 기본 정보 -->
        <section class="product-info">

            <p class="product-category" id="productCategory">
                메인메뉴
            </p>

            <h1 id="productName">오리지널 입덕볶이</h1>

            <p class="product-description" id="productDescription">
                매콤달콤 ♥ 입덕볶이의 대표 메뉴
            </p>

            <p class="product-price" id="productPrice">
                9,900원
            </p>

        </section>


        <!-- 맵기 선택 -->
        <section class="option-section" id="spicySection">

            <div class="section-title">

                <h2>맵기 선택</h2>

                <span class="required-label">필수 선택</span>

            </div>

            <p class="option-description">
                취향에 맞는 맵기를 선택해 주세요.
            </p>

            <div class="option-list">

                <label class="option-item">

                    <input type="radio" name="spicy" value="순한맛">

                    <span>순한맛</span>

                    <span class="option-price">0원</span>

                </label>

                <label class="option-item">

                    <input type="radio" name="spicy" value="보통맛" checked>

                    <span>보통맛</span>

                    <span class="option-price">0원</span>

                </label>

                <label class="option-item">

                    <input type="radio" name="spicy" value="매운맛">

                    <span>매운맛</span>

                    <span class="option-price">0원</span>

                </label>

                <label class="option-item">

                    <input type="radio" name="spicy" value="아주 매운맛">

                    <span>아주 매운맛</span>

                    <span class="option-price">0원</span>

                </label>

            </div>

        </section>


        <!-- 토핑 추가 -->
        <section class="option-section" id="toppingSection">

            <div class="section-title">

                <h2>토핑 추가</h2>

                <span class="optional-label">선택 사항</span>

            </div>

            <p class="option-description">
                좋아하는 토핑을 추가해 보세요!
            </p>

            <div class="option-list">

                <label class="option-item">

                    <input type="checkbox" name="topping"
                        value="모짜렐라 치즈" data-price="2000">

                    <span>모짜렐라 치즈</span>

                    <span class="option-price">+2,000원</span>

                </label>

                <label class="option-item">

                    <input type="checkbox" name="topping"
                        value="중국당면" data-price="2000">

                    <span>중국당면</span>

                    <span class="option-price">+2,000원</span>

                </label>

                <label class="option-item">

                    <input type="checkbox" name="topping"
                        value="분모자" data-price="2500">

                    <span>분모자</span>

                    <span class="option-price">+2,500원</span>

                </label>

                <label class="option-item">

                    <input type="checkbox" name="topping"
                        value="비엔나소시지" data-price="1500">

                    <span>비엔나소시지</span>

                    <span class="option-price">+1,500원</span>

                </label>

                <label class="option-item">

                    <input type="checkbox" name="topping"
                        value="메추리알" data-price="1000">

                    <span>메추리알</span>

                    <span class="option-price">+1,000원</span>

                </label>

            </div>

        </section>


        <!-- 수량 선택 -->
        <section class="quantity-section">

            <h2>수량</h2>

            <div class="quantity-box">

                <button id="minusButton" aria-label="수량 감소">−</button>

                <span id="quantity">1</span>

                <button id="plusButton" aria-label="수량 증가">+</button>

            </div>

        </section>


        <!-- 하단 고정 주문 영역 -->
        <footer class="order-footer">

            <div class="total-box">

                <span>총 주문금액</span>

                <strong id="totalPrice">9,900원</strong>

            </div>

            <div class="order-buttons">

                <button class="add-cart-button" id="addCart">
                    장바구니 담기
                </button>

                <button class="order-button" id="orderButton">
                    주문하기
                </button>

            </div>

        </footer>


        <!-- 장바구니 담기 완료 팝업 -->
        <div class="confirm-popup" id="confirmPopup">

            <div class="confirm-box">

                <div class="confirm-icon">

                    <svg width="36" height="36" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m20 6-11 11-5-5"/>
                    </svg>

                </div>

                <h2>장바구니에 담았어요!</h2>

                <p>다른 메뉴도 함께 입덕해 볼까요?</p>

                <div class="confirm-buttons">

                    <a href="../lists/lists.html" class="continue-button">
                        메뉴 더 보기
                    </a>

                    <a href="../lists/lists.html?cart=1" class="view-cart-button">
                        장바구니 보기
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // ==========================
        // 1. 메뉴 데이터
        // ==========================

        const menus = {

            main: [
                {
                    name: "오리지널 입덕볶이",
                    description: "매콤달콤 ♥ 입덕볶이의 대표 메뉴",
                    price: 9900,
                    image: "img/main01.png"
                },
                {
                    name: "꾸덕 로제에 입덕볶이",
                    description: "꾸덕꾸덕 ♥ 부드럽고 진한 로제",
                    price: 11900,
                    image: "img/main02.png"
                },
                {
                    name: "매움에 입덕볶이",
                    description: "아 매워 ♥ 스트레스 날려버리자",
                    price: 11900,
                    image: "img/main03.png"
                },
                {
                    name: "치즈 듬뿍에 입덕볶이",
                    description: "쭈우욱 ♥ 늘어나는 치즈가 가득",
                    price: 12900,
                    image: "img/main04.png"
                },
                {
                    name: "짜장에 입덕볶이",
                    description: "짜장에 퐁당 ♥ 밥 갖고온나",
                    price: 11900,
                    image: "img/main05.png"
                },
                {
                    name: "토핑 가득에 입덕볶이",
                    description: "뭐부터 먹지 ♥ 먹을 것이 한가득",
                    price: 13900,
                    image: "img/main06.png"
                }
            ],

            set: [
                {
                    name: "입덕 세트",
                    description: "떡볶이와 튀김의 완벽한 만남",
                    price: 15900,
                    image: "img/set01.png"
                },
                {
                    name: "친구랑 세트",
                    description: "둘이 먹으면 두 배로 맛있어",
                    price: 19900,
                    image: "img/set02.png"
                },
                {
                    name: "모둠 튀김 세트",
                    description: "바삭한 튀김을 한가득",
                    price: 17900,
                    image: "img/set03.png"
                },
                {
                    name: "패밀리 세트",
                    description: "온 가족이 함께 입덕!",
                    price: 29900,
                    image: "img/set04.png"
                }
            ],

            single: [
                {
                    name: "1인 오리지널 입덕볶이",
                    description: "혼자서도 맛있게 입덕 완료",
                    price: 5900,
                    image: "img/single01.png"
                },
                {
                    name: "1인 꾸덕 로제",
                    description: "혼자 즐기는 꾸덕한 로제",
                    price: 6900,
                    image: "img/single02.png"
                },
                {
                    name: "1인 치즈 떡볶이",
                    description: "혼자 먹어도 치즈는 듬뿍",
                    price: 7900,
                    image: "img/single03.png"
                },
                {
                    name: "1인 매운 떡볶이",
                    description: "혼자서도 화끈하게!",
                    price: 6900,
                    image: "img/single04.png"
                }
            ],

            side: [
                {
                    name: "모둠 튀김",
                    description: "바삭바삭 골라 먹는 재미",
                    price: 4500,
                    image: "img/side01.png"
                },
                {
                    name: "김말이",
                    description: "떡볶이 국물에 콕!",
                    price: 3000,
                    image: "img/side02.png"
                },
                {
                    name: "찰순대",
                    description: "쫄깃쫄깃 맛있는 순대",
                    price: 4500,
                    image: "img/side03.png"
                },
                {
                    name: "참치마요 주먹밥",
                    description: "매울 때 한입씩 쏙",
                    price: 3500,
                    image: "img/side04.png"
                },
                {
                    name: "치즈볼",
                    description: "겉은 바삭 속은 쫀득",
                    price: 4000,
                    image: "img/side05.png"
                },
                {
                    name: "꼬치 어묵",
                    description: "따끈한 국물과 함께",
                    price: 3000,
                    image: "img/side06.png"
                }
            ],

            drink: [
                {
                    name: "콜라",
                    description: "톡 쏘는 시원한 탄산",
                    price: 2000,
                    image: "img/drink01.png"
                },
                {
                    name: "사이다",
                    description: "깔끔하고 시원하게",
                    price: 2000,
                    image: "img/drink02.png"
                },
                {
                    name: "쿨피스",
                    description: "매운 떡볶이 필수템",
                    price: 2500,
                    image: "img/drink03.png"
                },
                {
                    name: "제로콜라",
                    description: "가볍게 즐기는 탄산",
                    price: 2000,
                    image: "img/drink04.png"
                }
            ]

        };


        // 카테고리 이름
        const categoryNames = {
            main: "메인메뉴",
            set: "세트메뉴",
            single: "1인메뉴",
            side: "사이드",
            drink: "음료"
        };


        // ==========================
        // 2. 선택한 메뉴 불러오기
        // ==========================

        const params = new URLSearchParams(window.location.search);

        let category = params.get('category') || 'main';

        let itemIndex = Number(params.get('item') || 0);

        // 잘못된 주소로 접속했을 때 기본 메뉴 표시
        if (!Object.hasOwn(menus, category) ||
            !Number.isInteger(itemIndex) ||
            !menus[category][itemIndex]) {

            category = 'main';
            itemIndex = 0;

        }

        const product = menus[category][itemIndex];


        // 메뉴 정보 화면에 표시
        document.getElementById('productName').textContent =
            product.name;

        document.getElementById('productDescription').textContent =
            product.description;

        document.getElementById('productPrice').textContent =
            product.price.toLocaleString() + '원';

        document.getElementById('productCategory').textContent =
            categoryNames[category];

        document.getElementById('productImage').src =
            '../lists/' + product.image;

        document.getElementById('productImage').alt =
            product.name;

        document.title = '입덕볶이 - ' + product.name;


        // ==========================
        // 3. 메뉴별 옵션 표시
        // ==========================

        const hasOptions = ['main', 'set', 'single'].includes(category);

        if (!hasOptions) {

            document.getElementById('spicySection').style.display = 'none';

            document.getElementById('toppingSection').style.display = 'none';

        }


        // ==========================
        // 4. 수량 조절
        // ==========================

        let quantity = 1;

        const quantityText = document.getElementById('quantity');
        const minusButton = document.getElementById('minusButton');
        const plusButton = document.getElementById('plusButton');

        minusButton.addEventListener('click', function () {

            if (quantity > 1) {

                quantity--;

                quantityText.textContent = quantity;

                updatePrice();

            }

        });

        plusButton.addEventListener('click', function () {

            quantity++;

            quantityText.textContent = quantity;

            updatePrice();

        });


        // ==========================
        // 5. 총 주문금액 계산
        // ==========================

        const toppingInputs = document.querySelectorAll(
            'input[name="topping"]'
        );

        const totalPrice = document.getElementById('totalPrice');

        let total = product.price;

        function updatePrice() {

            let toppingPrice = 0;

            if (hasOptions) {

                toppingInputs.forEach(function (input) {

                    if (input.checked) {

                        toppingPrice += Number(input.dataset.price);

                    }

                });

            }

            total = (product.price + toppingPrice) * quantity;

            totalPrice.textContent = total.toLocaleString() + '원';

            minusButton.disabled = quantity === 1;

        }


        // 토핑 선택 시 가격 변경
        toppingInputs.forEach(function (input) {

            input.addEventListener('change', updatePrice);

        });


        // ==========================
        // 6. 장바구니 저장
        // ==========================

        function saveCart() {

            let spicy = '';

            let toppings = [];

            if (hasOptions) {

                spicy = document.querySelector(
                    'input[name="spicy"]:checked'
                ).value;

                toppingInputs.forEach(function (input) {

                    if (input.checked) {

                        toppings.push(input.value);

                    }

                });

            }

            // 기존 장바구니 데이터 불러오기
            const cart = JSON.parse(
                localStorage.getItem('ipdeokOrderCart') || '[]'
            );


            // 현재 선택한 메뉴 정보
            const orderItem = {

                name: product.name,
                image: product.image,
                price: product.price,
                category: category,
                spicy: spicy,
                toppings: toppings,
                qty: quantity,
                total: total

            };


            // 동일한 메뉴와 옵션이 있는지 확인
            const existingItem = cart.find(function (item) {

                return item.name === orderItem.name &&
                    item.spicy === orderItem.spicy &&
                    JSON.stringify(item.toppings) ===
                    JSON.stringify(orderItem.toppings);

            });


            // 동일한 옵션이면 수량 합치기
            if (existingItem) {

                existingItem.qty += quantity;

                existingItem.total += total;

            } else {

                cart.push(orderItem);

            }


            // 장바구니 데이터 저장
            localStorage.setItem(
                'ipdeokOrderCart',
                JSON.stringify(cart)
            );

        }


        // ==========================
        // 7. 장바구니 담기 버튼
        // ==========================

        const addCart = document.getElementById('addCart');

        const confirmPopup = document.getElementById('confirmPopup');

        addCart.addEventListener('click', function () {

    saveCart();

    // 장바구니 담기 완료 상태 전달
    sessionStorage.setItem('ipdeokCartAdded', 'true');

    // 메뉴 리스트로 이동
    window.location.href = '../lists/lists.html';

});


        // 팝업 배경 클릭 시 닫기
        confirmPopup.addEventListener('click', function (event) {

            if (event.target === confirmPopup) {

                confirmPopup.classList.remove('active');

                document.body.style.overflow = '';

            }

        });


        // ==========================
        // 8. 주문하기 버튼
        // ==========================

        const orderButton = document.getElementById('orderButton');

        orderButton.addEventListener('click', function () {

    let spicy = '';

    let toppings = [];

    if (hasOptions) {

        spicy = document.querySelector(
            'input[name="spicy"]:checked'
        ).value;

        toppingInputs.forEach(function (input) {

            if (input.checked) {

                toppings.push(input.value);

            }

        });

    }

    // 바로 주문할 메뉴 정보
    const directOrder = {

        name: product.name,

        image: product.image,

        price: product.price,

        category: category,

        spicy: spicy,

        toppings: toppings,

        qty: quantity,

        total: total,

        detailUrl: window.location.href

    };

    // 기존 장바구니와 별도로 저장
    sessionStorage.setItem(
        'ipdeokDirectOrder',
        JSON.stringify(directOrder)
    );

    // 결제페이지 이동
    window.location.href =
        '../payment/payment.html?mode=direct';

});


        // ==========================
        // 9. 햄버거 메뉴
        // ==========================

        const menuOpen = document.getElementById('menuOpen');
        const menuClose = document.getElementById('menuClose');
        const menuLayer = document.getElementById('menuLayer');
        const menuOverlay = document.getElementById('menuOverlay');

        menuOpen.addEventListener('click', function () {

            menuLayer.classList.add('active');

            document.body.style.overflow = 'hidden';

        });

        function closeMenu() {

            menuLayer.classList.remove('active');

            document.body.style.overflow = '';

        }

        menuClose.addEventListener('click', closeMenu);

        menuOverlay.addEventListener('click', closeMenu);


        // ESC 키로 팝업 닫기
        document.addEventListener('keydown', function (event) {

            if (event.key === 'Escape') {

                closeMenu();

                confirmPopup.classList.remove('active');

            }

        });


        // 처음 접속했을 때 가격 계산
        updatePrice();

    </script>

</body>
</html>
